<!-- Esercizio: Tabelle -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Esempi di Meccatronica">
        <meta name="keywords" content="HTML, CSS, JavaScript">
        <meta name="author" content="Roberto Pioggia">       
        <title>Meccatronica HTML5</title>
        <link rel="icon" type="image/x-icon" href="favicon.png"> 
        <style>
            table, th, td {
                border:1px solid black;
            }
        </style>                        
    </head>
    <body> 

        <h2>TR definisce le righe della tabella</h2>

        <table style="width:100%">
            <tr>
                <th>Persona 1</th>
                <th>Persona 2</th>
                <th>Persona 3</th>
            </tr>            
            <tr>
                <td>Roberto</td>
                <td>Angelo</td>
                <td>Mario</td>
            </tr>
            <tr>
                <td>16</td>
                <td>14</td>
                <td>10</td>
            </tr>
        </table>       
                
    </body>
</html>
